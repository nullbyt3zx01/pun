name: Python tests
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unit tests (SDK not required)
        run: cd python && PYTHONPATH=. python -m unittest discover -s tests -v
